<!DOCTYPE html><html lang="en"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Job posting details"><title>Job detail · CR Jobs</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--bg: #0f172a;--surface: #1e293b;--surface-2: #273549;--border: #334155;--text: #e2e8f0;--muted: #94a3b8;--accent: #38bdf8;--accent-2: #818cf8;--radius: 12px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}.container{max-width:1100px;margin:0 auto;padding:0 1.25rem}header{border-bottom:1px solid var(--border);background:#0f172ad9;backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}header .container{display:flex;align-items:center;justify-content:space-between;height:60px}.logo{font-weight:700;font-size:1.15rem;color:var(--text);letter-spacing:-.02em}.logo span{color:var(--accent)}nav a{color:var(--muted);margin-left:1.25rem;font-size:.9rem}nav a:hover{color:var(--text);text-decoration:none}.hero{padding:3rem 0 1.5rem;text-align:center}.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 .5rem;letter-spacing:-.03em}.hero p{color:var(--muted);margin:0}.filters{display:flex;flex-wrap:wrap;gap:.75rem;padding:1.5rem 0;align-items:center}.filters input,.filters select{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.6rem .9rem;font-size:.9rem;outline:none}.filters input:focus,.filters select:focus{border-color:var(--accent)}.filters input[type=search]{flex:1;min-width:200px}.filters button{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:none;color:#0f172a;font-weight:600;border-radius:8px;padding:.6rem 1.2rem;cursor:pointer;font-size:.9rem}.filters button:hover{opacity:.9}.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem;padding-bottom:2rem}.job-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;display:flex;flex-direction:column;gap:.5rem;transition:border-color .15s,transform .15s}.job-card:hover{border-color:var(--accent);transform:translateY(-2px)}.job-card h3{margin:0;font-size:1.05rem;line-height:1.35}.job-card .meta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.8rem;color:var(--muted)}.badge{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:.15rem .6rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}.badge.portal{color:var(--accent);border-color:var(--accent)}.job-card .summary{font-size:.85rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:clamp;overflow:hidden}.job-card .card-footer{margin-top:auto;padding-top:.75rem;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}.state{text-align:center;padding:3rem 0;color:var(--muted)}.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}@keyframes spin{to{transform:rotate(360deg)}}.load-more{display:block;margin:0 auto 3rem}.detail{padding:2.5rem 0 4rem;max-width:760px}.detail h1{font-size:1.8rem;margin-bottom:.25rem;letter-spacing:-.02em}.detail .meta{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 1.5rem}.detail .description{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;white-space:pre-wrap;font-size:.95rem}.back-link{display:inline-block;margin-bottom:1.5rem;font-size:.9rem}footer{border-top:1px solid var(--border);padding:1.5rem 0;text-align:center;color:var(--muted);font-size:.8rem}
</style><script type="module">const p="https://crjobs-api.onrender.com",c=new URLSearchParams(window.location.search),s=c.get("portal"),i=c.get("id"),e=document.getElementById("detail");function t(o){return o.replace(/[&<>"']/g,n=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[n])}async function l(){if(!s||!i){e.innerHTML='<div class="state"><p>Missing portal or job id. <a href="/">Back to jobs</a></p></div>';return}try{const o=await fetch(`${p}/api/jobs/${encodeURIComponent(s)}/${encodeURIComponent(i)}`);if(!o.ok)throw new Error(`HTTP ${o.status}`);const n=await o.json(),a=n.job,r=a.description||a.summary||"No description available.";e.innerHTML=`
        <span class="badge portal">${t(n.portal||s)}</span>
        <h1>${t(a.title||"Untitled")}</h1>
        <div class="meta">
          ${a.company?`<span class="badge">${t(a.company)}</span>`:""}
          ${a.location?`<span class="badge">📍 ${t(a.location)}</span>`:""}
          ${a.category?`<span class="badge">${t(a.category)}</span>`:""}
        </div>
        <p><a href="${a.link}" target="_blank" rel="noopener">View original posting ↗</a></p>
        <div class="description">${t(r)}</div>
      `}catch{e.innerHTML=`
        <a href="/" class="back-link">← Back to jobs</a>
        <div class="state"><p>Could not load this job. It may have expired or the API is unavailable.</p></div>
      `}}l();
